<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Duckling + SDL2 (wasm64)</title><style>body{margin:0;background:#111;color:#ccc;font:14px monospace;display:flex;flex-direction:column;align-items:center}canvas{margin-top:16px;background:#000;outline:0}#status{margin:8px}#output{width:640px;max-width:95vw;height:120px;background:#000;color:#8f8;border:0}</style></head><body><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><div id=status>loading…</div><textarea id=output readonly></textarea><script>const output=document.getElementById("output"),status=document.getElementById("status");var Module={canvas:document.getElementById("canvas"),print:t=>{output.value+=t+"\n",output.scrollTop=output.scrollHeight,console.log(t)},printErr:t=>{output.value+="[err] "+t+"\n",console.error(t)},setStatus:t=>{status.textContent=t||"running"},onExit:t=>{status.textContent="exited with code "+t}};window.onerror=()=>{status.textContent="error, see console"}</script><script async src=index.js></script></body></html>
